name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_signed_artifact:
        description: Publish the protected signed and notarized CI test DMG
        required: true
        default: false
        type: boolean
      signed_artifact_version:
        description: Non-sentinel X.Y.Z version for the signed CI test artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check Subsystem README References
        run: bash scripts/check-readme-references.sh
      - name: Classify changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/classify_changes.py

  compact-transcript-prototype:
    if: >-
      (github.event_name == 'pull_request' &&
       github.head_ref == '025-prototype-compact-borderless-meeting-transcript') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/025-prototype-compact-borderless-meeting-transcript')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify self-contained prototype
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prototype = Path("prototypes/compact-borderless-meeting-transcript/index.html")
          files = sorted(path.name for path in prototype.parent.iterdir() if path.is_file())
          if files != ["README.md", "index.html"]:
              raise SystemExit(f"Unexpected prototype files: {files}")
          content = prototype.read_text()
          forbidden = ["<script src=", "<link rel=", "http://", "https://", "file:///"]
          found = [token for token in forbidden if token in content]
          if found:
              raise SystemExit(f"Prototype is not self-contained: {found}")
          required = ['key: "byline"', 'key: "rail"', 'key: "running"', "overlapId", "data-rename"]
          missing = [token for token in required if token not in content]
          if missing:
              raise SystemExit(f"Prototype contract is incomplete: {missing}")
          PY
      - name: Upload compact transcript prototype
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-compact-borderless-transcript-prototype
          path: prototypes/compact-borderless-meeting-transcript/index.html
          if-no-files-found: error
          retention-days: 14

  debug-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    # Five minutes is the normal-PR target, not a timeout that hides slow runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: debug-tests
      - name: Verify restored SwiftPM build behavior
        if: needs.changes.outputs.release == 'true'
        timeout-minutes: 2
        env:
          CI_SWIFT_CACHE_INTEGRATION: "1"
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_build_cache.py' 2>&1 | tee .ci-logs/cache-integration.log
      - name: Build app, CLI, and tests with concurrency diagnostics
        timeout-minutes: 7
        run: |
          set -o pipefail
          SECONDS=0
          swift build --build-tests -Xswiftc -warn-concurrency 2>&1 | tee .ci-logs/build-tests.log
          echo "Debug build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: All tests (class-grouped XCTest and native Swift Testing)
        timeout-minutes: 5
        run: |
          set -o pipefail
          SECONDS=0
          python3 scripts/ci/run_tests.py --workers 3 2>&1 | tee .ci-logs/swift-test.log
          echo "All tests: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI Contract Smoke
        timeout-minutes: 1
        run: bash scripts/ci/cli_smoke.sh .build/debug/macparakeet-cli
      - name: Upload debug logs and test counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-debug-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  swift6:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: swift6
      - name: Swift 6 Language Mode
        timeout-minutes: 7
        env:
          # Argmax 0.18.0 is not Swift 6 clean. The debug and release lanes
          # retain WhisperKit; this lane checks first-party language mode.
          MACPARAKEET_SKIP_WHISPERKIT: "1"
        run: |
          set -o pipefail
          SECONDS=0
          swift build -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee .ci-logs/swift-6-language-mode.log
          echo "Swift 6 build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Swift Format Lint (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcrun swift-format lint --recursive --configuration .swift-format Sources Tests 2>&1 | tee .ci-logs/swift-format-lint.log
      - name: Upload Swift 6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift6-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: changes
    # Release validation stays on main/manual runs and release-input PRs.
    # Ordinary source PRs intentionally do not wait for whole-module optimization.
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Swift Build (Release)
        timeout-minutes: 15
        run: |
          set -o pipefail
          SECONDS=0
          swift build -c release 2>&1 | tee .ci-logs/swift-build-release.log
          echo "Release build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI Contract Smoke
        timeout-minutes: 1
        run: bash scripts/ci/cli_smoke.sh .build/release/macparakeet-cli
      - name: Release Bundle Fixture Smoke
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        env:
          BUILD_SYSTEM: xcodebuild
          BUNDLE_YTDLP: "0"
          BUNDLE_NODE: "0"
          FFMPEG_PATH: /usr/bin/true
          VERSION: 0.0.0
          BUILD_NUMBER: ci
        run: |
          set -o pipefail
          bash scripts/dist/build_app_bundle.sh 2>&1 | tee .ci-logs/release-bundle-smoke.log
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-release-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  development-artifact:
    needs: swift-test
    if: >-
      needs.swift-test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Build, ad-hoc sign, package, and verify owner development DMG
        timeout-minutes: 30
        run: |
          set -o pipefail
          bash scripts/ci/publish_development_artifact.sh 2>&1 | tee development-artifact.log
      - name: Upload owner-only development DMG
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-owner-development-build
          path: dist/MacParakeet-owner-development-build.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Upload development artifact log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-artifact-log
          path: development-artifact.log
          if-no-files-found: warn
          retention-days: 3

  signed-artifact:
    needs: swift-test
    if: >-
      needs.swift-test.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_signed_artifact == true &&
      github.ref == 'refs/heads/main'
    environment: signed-ci-artifact
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Build, sign, notarize, and verify protected CI test artifact
        timeout-minutes: 70
        env:
          SIGNED_ARTIFACT_VERSION: ${{ inputs.signed_artifact_version }}
          DEVELOPMENT_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPMENT_ID_CERTIFICATE_BASE64 }}
          DEVELOPMENT_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -o pipefail
          export SIGNED_ARTIFACT_BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          bash scripts/ci/publish_signed_artifact.sh 2>&1 | tee signed-artifact.log
      - name: Upload signed and notarized CI test DMG
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-signed-notarized-ci-test
          path: dist/MacParakeet-signed-notarized-ci-test.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed artifact log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-artifact-log
          path: signed-artifact.log
          if-no-files-found: warn
          retention-days: 7

  # Preserve the previous check name as a stable, fail-closed merge gate.
  # Do not use workflow-level path ignores: prose PRs also need a final status.
  swift-test:
    needs: [changes, debug-tests, swift6, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check required results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py
