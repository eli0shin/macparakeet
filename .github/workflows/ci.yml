name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check Subsystem README References
        run: bash scripts/check-readme-references.sh
      - name: Classify changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/classify_changes.py

  debug-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    # Five minutes is the normal-PR target, not a timeout that hides slow runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: debug-tests
      - name: Verify restored SwiftPM build behavior
        if: needs.changes.outputs.release == 'true'
        timeout-minutes: 2
        env:
          CI_SWIFT_CACHE_INTEGRATION: "1"
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_build_cache.py' 2>&1 | tee .ci-logs/cache-integration.log
      - name: Build app, CLI, and tests with concurrency diagnostics
        timeout-minutes: 7
        run: |
          set -o pipefail
          SECONDS=0
          swift build --build-tests -Xswiftc -warn-concurrency 2>&1 | tee .ci-logs/build-tests.log
          echo "Debug build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: All tests (class-grouped XCTest and native Swift Testing)
        timeout-minutes: 5
        run: |
          set -o pipefail
          SECONDS=0
          python3 scripts/ci/run_tests.py --workers 3 2>&1 | tee .ci-logs/swift-test.log
          echo "All tests: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI Contract Smoke
        timeout-minutes: 1
        run: bash scripts/ci/cli_smoke.sh .build/debug/macparakeet-cli
      - name: Upload debug logs and test counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-debug-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  swift6:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: swift6
      - name: Swift 6 Language Mode
        timeout-minutes: 7
        env:
          # Argmax 0.18.0 is not Swift 6 clean. The debug and release lanes
          # retain WhisperKit; this lane checks first-party language mode.
          MACPARAKEET_SKIP_WHISPERKIT: "1"
        run: |
          set -o pipefail
          SECONDS=0
          swift build -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee .ci-logs/swift-6-language-mode.log
          echo "Swift 6 build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Swift Format Lint (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcrun swift-format lint --recursive --configuration .swift-format Sources Tests 2>&1 | tee .ci-logs/swift-format-lint.log
      - name: Upload Swift 6 logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift6-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: changes
    # Release validation stays on main/manual runs and release-input PRs.
    # Ordinary source PRs intentionally do not wait for whole-module optimization.
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Swift Build (Release)
        timeout-minutes: 15
        run: |
          set -o pipefail
          SECONDS=0
          swift build -c release 2>&1 | tee .ci-logs/swift-build-release.log
          echo "Release build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI Contract Smoke
        timeout-minutes: 1
        run: bash scripts/ci/cli_smoke.sh .build/release/macparakeet-cli
      - name: Release Bundle Fixture Smoke
        if: github.event_name == 'pull_request'
        timeout-minutes: 3
        env:
          BUILD_SYSTEM: swiftpm
          BUNDLE_YTDLP: "0"
          BUNDLE_NODE: "0"
          FFMPEG_PATH: /usr/bin/true
          VERSION: 0.0.0
          BUILD_NUMBER: ci
        run: |
          set -o pipefail
          bash scripts/dist/build_app_bundle.sh 2>&1 | tee .ci-logs/release-bundle-smoke.log
      - name: Build downloadable unsigned app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        timeout-minutes: 5
        env:
          BUILD_SYSTEM: swiftpm
          SKIP_BUILD: "1"
          BUILD_SOURCE: github-actions-unsigned-development
          VERSION: 0.0.0
          BUILD_NUMBER: ci
        run: |
          set -o pipefail
          bash scripts/dist/build_app_bundle.sh 2>&1 | tee .ci-logs/downloadable-app-build.log
          bash scripts/ci/verify_downloadable_app.sh dist/MacParakeet.app 2>&1 | tee .ci-logs/downloadable-app-helpers.log
      - name: Package unsigned app archive
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          test -d dist/MacParakeet.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent dist/MacParakeet.app dist/MacParakeet-unsigned-non-notarized.zip
          test -s dist/MacParakeet-unsigned-non-notarized.zip
          INSPECTION_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECTION_DIR"' EXIT
          /usr/bin/ditto -x -k dist/MacParakeet-unsigned-non-notarized.zip "$INSPECTION_DIR"
          test -d "$INSPECTION_DIR/MacParakeet.app/Contents"
          test -x "$INSPECTION_DIR/MacParakeet.app/Contents/MacOS/MacParakeet"
          test -x "$INSPECTION_DIR/MacParakeet.app/Contents/MacOS/macparakeet-cli"
          bash scripts/ci/verify_downloadable_app.sh "$INSPECTION_DIR/MacParakeet.app" 2>&1 | tee -a .ci-logs/downloadable-app-helpers.log
          while IFS= read -r -d '' SOURCE_PATH; do
            RELATIVE_PATH="${SOURCE_PATH#dist/MacParakeet.app}"
            EXTRACTED_PATH="$INSPECTION_DIR/MacParakeet.app$RELATIVE_PATH"
            test -e "$EXTRACTED_PATH" || test -L "$EXTRACTED_PATH"
            test "$(stat -f '%p' "$SOURCE_PATH")" = "$(stat -f '%p' "$EXTRACTED_PATH")"
            if test -L "$SOURCE_PATH"; then
              test "$(readlink "$SOURCE_PATH")" = "$(readlink "$EXTRACTED_PATH")"
            fi
          done < <(find dist/MacParakeet.app -print0)
          /usr/bin/unzip -l dist/MacParakeet-unsigned-non-notarized.zip | tee .ci-logs/unsigned-app-archive-contents.log
      - name: Upload unsigned non-notarized app
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-unsigned-non-notarized
          path: dist/MacParakeet-unsigned-non-notarized.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-release-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Preserve the previous check name as a stable, fail-closed merge gate.
  # Do not use workflow-level path ignores: prose PRs also need a final status.
  swift-test:
    needs: [changes, debug-tests, swift6, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check required results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py
