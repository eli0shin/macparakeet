name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - .tickets/**
      - docs/**
      - plans/**
      - spec/**
      - integrations/**
      - "*.md"
      - Sources/**/README.md
  pull_request:
  workflow_dispatch:
    inputs:
      publish_signed_artifact:
        description: Publish the protected signed and notarized CI test DMG
        required: true
        default: false
        type: boolean
      signed_artifact_version:
        description: Non-sentinel X.Y.Z version for the signed CI test artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight Checks and Change Classification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      cache_integration: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI scripts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check Subsystem README References
        run: bash scripts/check-readme-references.sh
      - name: Check Installer
        run: bash scripts/test_install.sh
      - name: Classify changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci/classify_changes.py

  test_suite:
    name: Swift 6 Build, Tests, and CLI Smoke
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: macos-26
    # Five minutes is the normal-PR target, not a timeout that hides slow runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set Up Debug Toolchain and Build Cache
        uses: ./.github/actions/setup-swift
        with:
          lane: debug-tests
      - name: Verify Restored SwiftPM Build Behavior
        if: needs.preflight.outputs.cache_integration == 'true'
        timeout-minutes: 2
        env:
          CI_SWIFT_CACHE_INTEGRATION: "1"
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_build_cache.py' 2>&1 | tee .ci-logs/cache-integration.log
      - name: Build app, CLI, and tests with concurrency diagnostics
        # A cold Xcode 26 build takes about nine minutes on the hosted runner.
        timeout-minutes: 12
        run: |
          set -o pipefail
          SECONDS=0
          swift build --build-tests -Xswiftc -warn-concurrency 2>&1 | tee .ci-logs/build-tests.log
          echo "Debug build: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: All tests (class-grouped XCTest and native Swift Testing)
        timeout-minutes: 5
        run: |
          set -o pipefail
          SECONDS=0
          python3 scripts/ci/run_tests.py --workers 3 2>&1 | tee .ci-logs/swift-test.log
          echo "All tests: ${SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
      - name: CLI Contract Smoke
        timeout-minutes: 1
        run: bash scripts/ci/cli_smoke.sh .build/debug/macparakeet-cli
      - name: Swift Format Lint (informational)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          xcrun swift-format lint --recursive --configuration .swift-format Sources Tests 2>&1 | tee .ci-logs/swift-format-lint.log
      - name: Upload debug logs and test counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-debug-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  signed_test_dmg:
    name: Build Signed and Notarized Test DMG
    needs: test_suite
    if: >-
      needs.test_suite.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_signed_artifact == true &&
      github.ref == 'refs/heads/main'
    environment: signed-ci-artifact
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set Up Release Toolchain and Build Cache
        uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Build, Sign, Notarize, and Verify Test DMG
        timeout-minutes: 70
        env:
          SIGNED_ARTIFACT_VERSION: ${{ inputs.signed_artifact_version }}
          DEVELOPMENT_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPMENT_ID_CERTIFICATE_BASE64 }}
          DEVELOPMENT_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPMENT_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -o pipefail
          export SIGNED_ARTIFACT_BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          bash scripts/ci/publish_signed_artifact.sh 2>&1 | tee signed-artifact.log
      - name: Upload signed and notarized CI test DMG
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-signed-notarized-ci-test
          path: dist/MacParakeet-signed-notarized-ci-test.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed artifact log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-artifact-log
          path: signed-artifact.log
          if-no-files-found: warn
          retention-days: 7
