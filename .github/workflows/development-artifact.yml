name: Build Owner Development DMG

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Development builds must not delay CI completion or release publication.
concurrency:
  group: owner-development-artifact-main
  cancel-in-progress: true

jobs:
  development-artifact:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'eli0shin/macparakeet' &&
      github.repository == 'eli0shin/macparakeet'
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swift
        with:
          lane: release
      - name: Build, ad-hoc sign, package, and verify owner development DMG
        timeout-minutes: 30
        run: |
          set -o pipefail
          bash scripts/ci/publish_development_artifact.sh 2>&1 | tee development-artifact.log
      - name: Upload owner-only development DMG
        uses: actions/upload-artifact@v7
        with:
          name: MacParakeet-owner-development-build
          path: dist/MacParakeet-owner-development-build.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Upload development artifact log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-artifact-log
          path: development-artifact.log
          if-no-files-found: warn
          retention-days: 3
